# PR validation workflow.
#
# Calls `just ci` so the same command developers run locally is what CI
# runs. Add language-specific toolchain installs as needed; everything
# else lives in the project's Justfile.
name: pr

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v2

      # Replace this block with the language-specific toolchain your
      # project needs. The just recipes don't care which one it is.
      - name: Install Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cargo
            ~/go/pkg/mod
            node_modules
          key: ${{ runner.os }}-just-setup-${{ hashFiles('**/uv.lock', '**/Cargo.lock', '**/pnpm-lock.yaml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-just-setup-

      - name: Install project dependencies
        run: just setup

      - name: Run CI checks (quality-full + test + build)
        run: just ci
